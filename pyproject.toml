[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "join-grain"
version = "0.1.0"
description = "Disk-backed CSV join cardinality preflight with aggregate-only reports."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "KanadeK"}]
dependencies = []
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/KanadeK/join-grain"
Issues = "https://github.com/KanadeK/join-grain/issues"

[project.scripts]
join-grain = "join_grain.cli:main"

[tool.setuptools.packages.find]
include = ["join_grain*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
source = ["join_grain"]

[tool.coverage.report]
show_missing = true
